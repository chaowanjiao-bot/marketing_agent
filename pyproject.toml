[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-creative-agent"
version = "0.1.0"
description = "Agentic marketing image generation, editing, VQA, and OCR quality loop"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "pydantic==2.10.6", "langgraph==0.2.76", "langchain-core==0.3.39",
  "fastapi==0.115.8", "starlette==0.45.3", "httpx==0.28.1",
  "uvicorn==0.34.0", "python-multipart==0.0.20", "hydra-core==1.3.2",
  "iopath==0.1.10",
  "pillow==11.1.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
include = ["marketing_agent*"]

[tool.setuptools.package-data]
marketing_agent = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
